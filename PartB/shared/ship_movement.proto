syntax = "proto2";

// Message to connect (replaces "CONNECT %c")
message Connect {
    required string client_id = 1;
    required string password = 2; // Authentication token
}

// Message to control thrust (key down/up)
message Thrust {
    required string client_id = 1;
    required string password = 2; // Client password for authentication
    required string direction = 3;
    required bool active = 4; // true on key down, false on key up
}

// Message to disconnect cleanly
message Disconnect {
    required string client_id = 1;
    required string password = 2; // authenticate disconnect
}

// Response from server (replaces simple string responses)
message ServerResponse {
    required string message = 1;

    // Optional full state snapshot for client rendering
    optional StateSnapshot state = 2;
}

// Wrapper to carry different message types on the same socket
message Envelope {
    enum Type {
        CONNECT = 0;
        THRUST = 1;
        STATE_REQUEST = 2; // Client can ask explicitly for state (optional)
        DISCONNECT = 3;     // Client voluntarily disconnects
    }

    required Type type = 1;
    optional Connect connect = 2;
    optional Thrust thrust = 3;
    optional Disconnect disconnect = 4;
    // For STATE_REQUEST, no payload needed
}

// ---------- State sync for client display ----------
message PlanetState {
    required float x = 1;
    required float y = 2;
    required float mass = 3;
    required bool is_recycling = 4;
}

message TrashState {
    required float x = 1;
    required float y = 2;
    required float mass = 3;
}

message ShipState {
    required float x = 1;
    required float y = 2;
    required int32 load = 3;
    required int32 capacity = 4;
    required bool connected = 5;
}

message StateSnapshot {
    repeated PlanetState planets = 1;
    repeated TrashState trash = 2;
    repeated ShipState ships = 3;
}