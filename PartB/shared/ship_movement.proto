syntax = "proto2";

// Message to connect (replaces "CONNECT %c")
message Connect {
    required string client_id = 1;
    required string password = 2;  // Authentication token
}

// Message to control thrust (key down/up)
message Thrust {
    required string client_id = 1;
    required string password = 2;     // Client password for authentication
    required string direction = 3;
    required bool active = 4;         // true on key down, false on key up
}

// Response from server (replaces simple string responses)
message ServerResponse {
    required string message = 1;
}

// Wrapper to carry different message types on the same socket
message Envelope {
    enum Type {
        CONNECT = 0;
        THRUST = 1;
    }

    required Type type = 1;
    optional Connect connect = 2;
    optional Thrust thrust = 3;
}